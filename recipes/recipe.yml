---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/alexrayosb/my-bazzite
name: my-bazzite
description: Bazzite (KDE) + NordVPN + Envision/VR stack

# Match the image currently deployed (see: rpm-ostree status)
base-image: ghcr.io/ublue-os/bazzite
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /  # copies files/system/* into the image root

  - type: dnf
    repos:
      files:
        - nordvpn.repo  # lives at files/dnf/nordvpn.repo in this repo
      copr:
        - jackgreiner/lug-helper
    install:
      packages:
        # NordVPN (official repo; GUI lands in /opt, handled automatically)
        - nordvpn
        - nordvpn-gui
        # Envision / VR stack (all from official Fedora repos except lug-helper)
        - boost
        - librealsense
        - libuvc
        - lug-helper
        - onnxruntime
        - opencv
        - opencv-video
        - openhmd
        - openvr-api
        - python3-tkinter
        - vte291-gtk4
        - xr-hardware
        - monado
        - xrizer

  - type: systemd
    system:
      enabled:
        - nordvpnd  # VPN daemon starts on boot, no manual enable needed

  - type: signing  # required for signed-image verification to work
